name: thesis-partner

x-app: &app
  image: thesis-partner:local
  build: .
  user: "${LOCAL_UID:-501}:${LOCAL_GID:-20}"
  init: true
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  environment: &app-env
    NODE_ENV: production
    CONTAINER_RUNTIME: "1"
    NEXT_TELEMETRY_DISABLED: "1"
    APP_ORIGIN: "${APP_ORIGIN:-http://127.0.0.1:3000}"
    APP_DATA_DIR: /data
    PAPERS_DIR: /library
    CONFIG_DIR: /config
    ARTIFACTS_DIR: /artifacts
    MASTER_KEY_FILE: /run/secrets/master_key
    POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    QDRANT_URL: http://qdrant:6333
  secrets: [master_key, postgres_password]
  networks: [storage, outbound]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
  depends_on:
    postgres: { condition: service_healthy }
    qdrant: { condition: service_started }

services:
  web:
    <<: *app
    command: [web]
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - type: bind
        source: "${PAPERS_DIR:-./library}"
        target: /library
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: "${APP_DATA_DIR:-./data}/config"
        target: /config
        bind: { create_host_path: false }
      - type: bind
        source: "${APP_DATA_DIR:-./data}/artifacts"
        target: /artifacts
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: "${APP_DATA_DIR:-./data}/bootstrap-token"
        target: /data/bootstrap-token
        read_only: true
        bind: { create_host_path: false }
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /app/apps/web/.next/standalone/apps/web/.next/cache:rw,nosuid,size=128m,mode=1777
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  worker:
    <<: *app
    command: [worker]
    volumes:
      - type: bind
        source: "${PAPERS_DIR:-./library}"
        target: /library
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: "${APP_DATA_DIR:-./data}/config"
        target: /config
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: "${APP_DATA_DIR:-./data}/artifacts"
        target: /artifacts
        bind: { create_host_path: false }
      - model_cache:/model-cache
    stop_grace_period: 40s
    restart: unless-stopped
  postgres:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    environment:
      POSTGRES_USER: thesis
      POSTGRES_DB: thesis
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --data-checksums
    secrets: [postgres_password]
    volumes: [postgres_data:/var/lib/postgresql]
    networks: [storage]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U thesis -d thesis"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.19.1@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes: [qdrant_data:/qdrant/storage]
    networks: [storage]
    restart: unless-stopped

networks:
  storage: { internal: true }
  outbound: {}
volumes:
  postgres_data: {}
  qdrant_data: {}
  model_cache: {}
secrets:
  master_key: { file: "${APP_DATA_DIR:-./data}/master.key" }
  postgres_password: { file: "${APP_DATA_DIR:-./data}/postgres-password" }
